creation_rules:
  - path_regex: 'deploy[/\\]config[/\\]production[/\\]secrets[/\\][^/\\]+-database\.sops\.yaml$'
    encrypted_regex: ^password$
    age: &platform-secrets 
  - path_regex: 'deploy[/\\]config[/\\]production[/\\]secrets[/\\][^/\\]+\.sops\.yaml$'
    encrypted_regex: ^(data|stringData)$
    age: *platform-secrets
