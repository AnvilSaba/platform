#:schema ../schemas/discord-management.schema.json
schema_version = 1

[roles.moderator]
name = "運営"
hoist = true
mentionable = false

[roles.moderator.permissions]
MANAGE_MESSAGES = true

[channels.information]
type = "category"
name = "案内"

[channels.rules]
type = "text"
name = "ルール"
parent = "information"
topic = "共通の案内"
slowmode_seconds = { default = true }

[channels.rules.overwrites.everyone]
VIEW_CHANNEL = "allow"
SEND_MESSAGES = "deny"

[channels.news]
type = "announcement"
name = "お知らせ"
parent = "information"
topic = "最新情報"
default_auto_archive_minutes = 4320

[channels.general_voice]
type = "voice"
name = "General"
parent = "information"
bitrate = 96000
user_limit = 12
rtc_region = { clear = true }
video_quality = "auto"

[channels.town_hall]
type = "stage"
name = "Town Hall"
parent = "information"
bitrate = 64000
user_limit = 10000
rtc_region = { clear = true }
video_quality = "full"

[channels.questions]
type = "forum"
name = "質問"
parent = "information"
topic = "質問はこちら"
default_auto_archive_minutes = 4320
default_thread_slowmode_seconds = 10
default_reaction = "❓"
default_sort_order = "latest_activity"
default_forum_layout = "list"

[message_sets.guidelines]
channel = "rules"

[[message_sets.guidelines.body]]
id = "basic"
body = '''
# 基本ルール
互いを尊重してください。

[具体例を見る](thread:basic_details)

[質問について](message:guidelines/questions)
'''

[[message_sets.guidelines.body]]
id = "questions"
body = '''
## 質問について
質問先を確認してください。

[基本ルールへ戻る](message:guidelines/basic)
'''

[threads.basic_details]
channel = "rules"
name = "基本ルールの補足"

[[threads.basic_details.body]]
id = "examples"
body = '''
# 具体例
補足の説明です。
'''
