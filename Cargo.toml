[workspace]
resolver = "3"
members = [
  "apps/mc-link-server",
  "apps/public-api",
  "apps/db-migrator",
  "apps/bot",
  "crates/bot-macros",
  "crates/platform-database",
  "crates/platform-signal",
]

[workspace.dependencies]
aes = "0.9.3"
anyhow = "1"
async-stream = "0.3"
axum = "0.8"
bpaf = "0.9"
cfb8 = "0.9.1"
chrono = "0.4"
dashmap = "6.1"
duration-str = "0.21"
fastnbt = "2.6"
futures = "0.3"
http-body-util = "0.1"
httpdate = "1"
itertools = "0.15"
mc_protocol = { version = "2.2.0", default-features = false }
nutype = "0.8.0"
poise = { git = "https://github.com/serenity-rs/poise", rev = "b189f7c1cfd47eb4e7863683a49c389a9702ce23" }
quote = "1"
rand = "0.10"
regex = "1.0"
reqwest = "0.13"
rsa = "0.9"
rustls = { version = "0.23", default-features = false }
rustyline = { version = "18", default-features = false }
serde = "1"
serde_json = "1"
serde_with = "3"
serenity = { git = "https://github.com/serenity-rs/serenity", rev = "37b9f433ada8b9ccc5f93f04826403b175855f86" }
sha1 = "0.11"
sha2 = "0.10"
similar = "3.1"
sqlx = { version = "0.9", default-features = false }
syn = "2"
sysinfo = "0.39"
thiserror = "2"
tokio = "1"
toml = "1.0"
tower = "0.5"
tracing = "0.1"
tracing-subscriber = "0.3"
uuid = "1"

[profile.release]
panic = "abort"
strip = true
opt-level = "z"
lto = true
codegen-units = 1

# Poise が next ブランチを参照しているので、直接の依存関係に合わせる
[replace."https://github.com/serenity-rs/serenity#serenity:0.12.5"]
git = "https://github.com/serenity-rs/serenity"
rev = "37b9f433ada8b9ccc5f93f04826403b175855f86"
