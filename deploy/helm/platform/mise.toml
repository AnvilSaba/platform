[tasks.check]
description = "Helm Chart の lint とテンプレート生成を検査する"
run = [
  "helm lint . --set bot.image.tag=test --set mcLinkServer.image.tag=test --set publicApi.image.tag=test",
  "helm template platform . --namespace anvilsaba --set bot.image.tag=test --set mcLinkServer.image.tag=test --set publicApi.image.tag=test >{{ vars.null }}",
]
