{{- if .Values.migration.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: db-migrator
  annotations:
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-weight: "0"
    helm.sh/hook-delete-policy: before-hook-creation
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 600
  template:
    spec:
      restartPolicy: Never
      {{- include "platform.rustPodSettings" . | nindent 6 }}
      containers:
        - name: migrate
          image: "{{ .Values.migration.image.repository }}:{{ required "migration.image.tag is required" .Values.migration.image.tag }}"
          imagePullPolicy: {{ .Values.migration.image.pullPolicy }}
          securityContext: {{ include "platform.restrictedContainerSecurityContext" . | nindent 12 }}
          env:
            {{- include "platform.databaseEnv" (dict "service" .Values.migration "postgres" .Values.postgres) | nindent 12 }}
{{- end }}
