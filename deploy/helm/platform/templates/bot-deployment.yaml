apiVersion: apps/v1
kind: Deployment
metadata:
  name: bot
  labels: { app.kubernetes.io/name: bot }
spec:
  replicas: {{ .Values.bot.replicas }}
  selector:
    matchLabels: { app.kubernetes.io/name: bot }
  template:
    metadata:
      labels: { app.kubernetes.io/name: bot }
    spec:
      {{- include "platform.rustPodSettings" . | nindent 6 }}
      containers:
        - name: bot
          image: {{ include "platform.image" .Values.bot.image | quote }}
          imagePullPolicy: {{ .Values.bot.image.pullPolicy }}
          stdin: true
          tty: true
          workingDir: /app
          args: ["--config", "/app/config/config.toml", "--keyword-file", "/app/config/keyword"]
          env:
            - name: DISCORD_BOT_TOKEN
              valueFrom:
                secretKeyRef: { name: {{ .Values.bot.secretName }}, key: token }
            {{- include "platform.databaseEnv" (dict "service" .Values.bot "postgres" .Values.postgres) | nindent 12 }}
          securityContext:
            {{- include "platform.restrictedContainerSecurityContext" . | nindent 12 }}
          volumeMounts:
            - name: config
              mountPath: /app/config
              readOnly: true
      volumes:
        - name: config
          projected:
            sources:
              - configMap:
                  name: {{ .Values.bot.configMapName }}
                  items:
                    - key: config.toml
                      path: config.toml
              - secret:
                  name: {{ .Values.bot.secretName }}
                  items:
                    - key: authKeyword
                      path: keyword
