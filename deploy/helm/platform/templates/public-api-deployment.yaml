{{- if .Values.publicApi.image.tag }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: public-api
spec:
  replicas: {{ .Values.publicApi.replicas }}
  selector:
    matchLabels: { app.kubernetes.io/name: public-api }
  template:
    metadata:
      labels: { app.kubernetes.io/name: public-api }
    spec:
      {{- include "platform.rustPodSettings" . | nindent 6 }}
      containers:
        - name: public-api
          image: {{ printf "%s:%s" .Values.publicApi.image.repository .Values.publicApi.image.tag | quote }}
          imagePullPolicy: {{ .Values.publicApi.image.pullPolicy }}
          securityContext: {{ include "platform.restrictedContainerSecurityContext" . | nindent 12 }}
          ports:
            - { name: http, containerPort: {{ .Values.publicApi.port }} }
          env:
            {{- include "platform.databaseEnv" (dict "service" .Values.publicApi "postgres" .Values.postgres) | nindent 12 }}
            - name: PUBLIC_API_LISTEN
              value: {{ printf "0.0.0.0:%v" .Values.publicApi.port | quote }}
          readinessProbe:
            httpGet: { path: /whitelist.json, port: http }
{{- else if gt (int .Values.publicApi.replicas) 0 }}
{{- fail "publicApi.image.tag is required when replicas > 0" }}
{{- end }}
