apiVersion: apps/v1
kind: Deployment
metadata:
  name: public-api
spec:
  replicas: {{ .Values.publicApi.replicas }}
  selector:
    matchLabels: { app.kubernetes.io/name: public-api }
  template:
    metadata:
      labels: { app.kubernetes.io/name: public-api }
    spec:
      {{- include "platform.rustPodSettings" . | nindent 6 }}
      containers:
        - name: public-api
          image: {{ printf "%s:%s" .Values.publicApi.image.repository (required "publicApi.image.tag is required" .Values.publicApi.image.tag) | quote }}
          imagePullPolicy: {{ .Values.publicApi.image.pullPolicy }}
          securityContext: {{ include "platform.restrictedContainerSecurityContext" . | nindent 12 }}
          ports:
            - { name: http, containerPort: 8080 }
          env:
            {{- include "platform.databaseEnv" (dict "service" .Values.publicApi "postgres" .Values.postgres) | nindent 12 }}
          readinessProbe:
            httpGet: { path: /whitelist.json, port: http }
