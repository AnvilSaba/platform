{{- range $key := list "mcLinkServer" "publicApi" }}
{{- $service := index $.Values $key }}
{{- $name := ternary "mc-link-server" "public-api" (eq $key "mcLinkServer") }}
{{- if $service.image.tag }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
spec:
  replicas: {{ $service.replicas }}
  selector:
    matchLabels: { app.kubernetes.io/name: {{ $name }} }
  template:
    metadata:
      labels: { app.kubernetes.io/name: {{ $name }} }
    spec:
      automountServiceAccountToken: false
      imagePullSecrets: {{ toYaml $.Values.imagePullSecrets | nindent 8 }}
      securityContext:
        runAsNonRoot: true
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: {{ $name }}
          image: {{ printf "%s:%s" $service.image.repository $service.image.tag | quote }}
          imagePullPolicy: {{ $service.image.pullPolicy }}
          securityContext: {{ include "platform.restrictedContainerSecurityContext" $ | nindent 12 }}
          ports:
            - { name: tcp, containerPort: {{ $service.port }} }
          env:
            - name: DATABASE_URL
              value: {{ printf "postgres://%s@%s:%v/%s" $service.databaseUsername $.Values.postgres.serviceName $.Values.postgres.port $.Values.postgres.database | quote }}
            - name: DATABASE_PASSWORD
              valueFrom:
                secretKeyRef: { name: {{ $service.databaseSecretName }}, key: password }
{{- if eq $key "publicApi" }}
            - name: PUBLIC_API_LISTEN
              value: {{ printf "0.0.0.0:%v" $service.port | quote }}
          readinessProbe:
            httpGet: { path: /whitelist.json, port: tcp }
{{- else }}
          readinessProbe:
            tcpSocket: { port: tcp }
          volumeMounts:
            - { name: config, mountPath: /app/config.toml, subPath: config.toml, readOnly: true }
      volumes:
        - name: config
          secret: { secretName: {{ $service.configSecretName }} }
{{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
spec:
  type: {{ default "ClusterIP" $service.serviceType }}
  selector: { app.kubernetes.io/name: {{ $name }} }
  ports:
    - { name: tcp, port: {{ $service.port }}, targetPort: tcp }
{{- else if gt (int $service.replicas) 0 }}
{{- fail (printf "%s.image.tag is required when replicas > 0" $key) }}
{{- end }}
{{- end }}
