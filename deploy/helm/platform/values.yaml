imagePullSecrets: []

bot:
  replicas: 1
  image:
    repository: ghcr.io/anvilsaba/bot
    tag: ""
    pullPolicy: IfNotPresent
  configSecretName: bot-config
  databaseUsername: platform_bot
  databaseSecretName: bot-database

mcguildlink:
  replicas: 1
  image:
    repository: ghcr.io/anvilsaba/mcguildlink-old
    tag: ""
    pullPolicy: IfNotPresent
  configSecretName: mcguildlink-config
  sqlite:
    storageSize: 1Gi
    storageClassName: ""
  http:
    port: 8080
  minecraft:
    port: 25565

# 旧 Kotlin 版は既存の mcguildlink 設定で保持する。本番切替は別作業。
mcLinkServer:
  replicas: 0
  image:
    repository: ghcr.io/anvilsaba/mc-link-server
    tag: ""
    pullPolicy: IfNotPresent
  configSecretName: mc-link-server-config
  databaseUsername: platform_mcguildlink
  databaseSecretName: mc-link-server-database
  port: 25565
  serviceType: ClusterIP

publicApi:
  replicas: 0
  image:
    repository: ghcr.io/anvilsaba/public-api
    tag: ""
    pullPolicy: IfNotPresent
  databaseUsername: platform_public_api
  databaseSecretName: public-api-database
  port: 8080

migration:
  enabled: false
  image:
    repository: ghcr.io/anvilsaba/db-migrator
    tag: ""
    pullPolicy: IfNotPresent
  databaseUsername: platform_migrator_job
  databaseSecretName: migration-database

postgres:
  replicas: 1
  serviceName: postgres
  port: 5432
  image:
    repository: postgres
    tag: "18.6-trixie"
    pullPolicy: IfNotPresent
  database: platform
  username: platform_migrator
  storageSize: 10Gi
  storageClassName: ""
  secretName: postgres

cloudflared:
  replicas: 1
  image:
    repository: cloudflare/cloudflared
    tag: "2026.8.2"
    pullPolicy: IfNotPresent
  tokenSecretName: cloudflare-tunnel
