imagePullSecrets: []

bot:
  replicas: 1
  image:
    repository: ghcr.io/anvilsaba/bot
    tag: ""
    pullPolicy: IfNotPresent
  configSecretName: bot-config
  databaseUsername: platform_bot
  databaseSecretName: bot-database

mcguildlink:
  replicas: 1
  image:
    repository: ghcr.io/anvilsaba/mcguildlink
    tag: ""
    pullPolicy: IfNotPresent
  configSecretName: mcguildlink-config
  sqlite:
    storageSize: 1Gi
    storageClassName: ""
  http:
    port: 8080
  minecraft:
    port: 25565

postgres:
  replicas: 1
  serviceName: postgres
  port: 5432
  image:
    repository: postgres
    tag: "18.6-trixie"
    pullPolicy: IfNotPresent
  database: platform
  username: platform_migrator
  storageSize: 10Gi
  storageClassName: ""
  secretName: postgres

cloudflared:
  replicas: 1
  image:
    repository: cloudflare/cloudflared
    tag: "2026.8.2"
    pullPolicy: IfNotPresent
  tokenSecretName: cloudflare-tunnel
