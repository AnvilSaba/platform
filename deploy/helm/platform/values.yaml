imagePullSecrets: []

bot:
  replicas: 1
  image:
    repository: ghcr.io/anvilsaba/bot
    tag: ""
    pullPolicy: IfNotPresent
  configSecretName: bot-config
  databaseUsername: platform_bot
  databaseSecretName: bot-db-credentials

mcLinkServer:
  replicas: 1
  image:
    repository: ghcr.io/anvilsaba/mc-link-server
    tag: ""
    pullPolicy: IfNotPresent
  databaseUsername: platform_mc_link_server
  databaseSecretName: mc-link-server-db-credentials
  # Service 側のポート。コンテナ内は25565固定。
  port: 25565

publicApi:
  replicas: 1
  image:
    repository: ghcr.io/anvilsaba/public-api
    tag: ""
    pullPolicy: IfNotPresent
  databaseUsername: platform_public_api
  databaseSecretName: public-api-db-credentials
  # Service 側のポート。コンテナ内は8080固定。
  port: 8080

migration:
  enabled: false
  image:
    repository: ghcr.io/anvilsaba/db-migrator
    tag: ""
    pullPolicy: IfNotPresent
  databaseUsername: platform_db_migrator
  databaseSecretName: db-migrator-db-credentials

postgres:
  replicas: 1
  serviceName: postgres
  port: 5432
  image:
    repository: postgres
    tag: "18.6-trixie"
    pullPolicy: IfNotPresent
  database: platform
  username: platform_migrator
  storageSize: 10Gi
  storageClassName: ""
  secretName: postgres-db-credentials

cloudflared:
  replicas: 1
  image:
    repository: cloudflare/cloudflared
    tag: "2026.8.2"
    pullPolicy: IfNotPresent
  tokenSecretName: cloudflare-tunnel
