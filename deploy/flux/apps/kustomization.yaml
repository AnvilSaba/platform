apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: anvilsaba
resources:
  - chart.yaml
  - release.yaml
  - ../../helm/platform
configMapGenerator:
  - name: platform-release-values
    files:
      - values.yaml
generatorOptions:
  disableNameSuffixHash: true
  labels:
    reconcile.fluxcd.io/watch: Enabled
