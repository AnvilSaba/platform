apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: platform
  namespace: anvilsaba
spec:
  # DB 移行とリリースタグの確認が終わってから Git で解除する。
  suspend: true
  interval: 5m
  releaseName: platform
  targetNamespace: anvilsaba
  storageNamespace: anvilsaba
  chartRef:
    kind: OCIRepository
    name: platform-chart
  valuesFrom:
    - kind: ConfigMap
      name: platform-production-values
    - kind: ConfigMap
      name: platform-release-values
  timeout: 10m
  driftDetection:
    mode: enabled
  install:
    strategy:
      name: RetryOnFailure
      retryInterval: 5m
  upgrade:
    remediation:
      retries: 1
      strategy: rollback
