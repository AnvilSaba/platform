apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: platform-apps
  namespace: flux-system
spec:
  interval: 5m
  path: ./deploy/flux/apps
  prune: false
  deletionPolicy: Orphan
  sourceRef:
    kind: GitRepository
    name: platform
  dependsOn:
    - name: platform-db-roles
    - name: platform-config
  healthChecks:
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: platform
      namespace: anvilsaba
  timeout: 15m
