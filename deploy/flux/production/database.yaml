apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: cnpg-operator
  namespace: flux-system
spec:
  interval: 5m
  path: ./deploy/postgres/operator
  prune: false
  deletionPolicy: Orphan
  sourceRef:
    kind: GitRepository
    name: platform
  healthChecks:
    - apiVersion: apps/v1
      kind: Deployment
      name: cnpg-controller-manager
      namespace: cnpg-system
  timeout: 5m
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: platform-db
  namespace: flux-system
spec:
  # 既存 DB の停止・バックアップ完了後に Git で解除する。
  suspend: true
  interval: 5m
  path: ./deploy/postgres/import
  prune: false
  deletionPolicy: Orphan
  sourceRef:
    kind: GitRepository
    name: platform
  dependsOn:
    - name: cnpg-operator
    - name: platform-config
  healthChecks:
    - apiVersion: postgresql.cnpg.io/v1
      kind: Cluster
      name: platform-db
      namespace: anvilsaba
  timeout: 30m
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: platform-db-roles
  namespace: flux-system
spec:
  interval: 5m
  path: ./deploy/postgres/roles
  prune: false
  deletionPolicy: Orphan
  sourceRef:
    kind: GitRepository
    name: platform
  dependsOn:
    - name: platform-db
    - name: platform-config
  wait: true
  healthCheckExprs:
    - apiVersion: postgresql.cnpg.io/v1
      kind: DatabaseRole
      current: >-
        has(status) && has(status.applied) && status.applied == true &&
        has(status.observedGeneration) && status.observedGeneration == metadata.generation
  timeout: 5m
