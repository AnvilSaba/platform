apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: platform-config
  namespace: flux-system
spec:
  # 旧アプリの Secret を変更するため、移行時の書き込み停止後に Git で解除する。
  suspend: true
  interval: 5m
  path: ./deploy/config/production
  prune: true
  deletionPolicy: Orphan
  sourceRef:
    kind: GitRepository
    name: platform
  decryption:
    provider: sops
    secretRef:
      name: sops-age
