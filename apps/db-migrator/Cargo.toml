[package]
name = "db-migrator"
# Cargo のパッケージメタデータ。独立したリリースバージョンとしては使用しない。
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[dependencies]
sqlx = { workspace = true, features = ["runtime-tokio", "tls-rustls-aws-lc-rs", "postgres", "migrate", "macros"] }
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }

platform-database = { path = "../../crates/platform-database" }
