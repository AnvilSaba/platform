name: Build image
description: GHCR のイメージタグ・キャッシュ・ビルド・公開を共通化する。
inputs:
  image:
    description: GHCR イメージ名
    required: true
  token:
    description: GHCR 認証 token
    required: true
  release-ref:
    description: リリースタグ（空の場合は SHA のみ）
    default: ""
  dockerfile:
    description: 使用する Dockerfile
    default: deploy/Dockerfile.rust
  build-args:
    description: Docker ビルド引数
    default: ""
  platforms:
    description: 配布アーキテクチャ
    default: linux/arm64
runs:
  using: composite
  steps:
    - name: Resolve release image tag
      id: release
      shell: bash
      env:
        RELEASE_REF: ${{ inputs.release-ref }}
      run: echo "image_tag=${RELEASE_REF#*/}" >> "$GITHUB_OUTPUT"
    - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ inputs.token }}
    - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
    - uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
      id: meta
      with:
        images: ${{ inputs.image }}
        tags: |
          type=sha
          type=raw,value=${{ steps.release.outputs.image_tag }},enable=${{ steps.release.outputs.image_tag != '' }}
    - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
      with:
        context: .
        file: ${{ inputs.dockerfile }}
        build-args: ${{ inputs.build-args }}
        platforms: ${{ inputs.platforms }}
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        cache-from: type=registry,ref=${{ inputs.image }}:buildcache
        cache-to: type=registry,ref=${{ inputs.image }}:buildcache,mode=max
