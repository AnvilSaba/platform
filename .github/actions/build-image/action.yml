name: Build image
description: GHCR のイメージタグ・キャッシュ・ビルド・公開を共通化する。
inputs:
  image:
    description: GHCR イメージ名
    required: true
  token:
    description: GHCR 認証 token
    required: true
  release-ref:
    description: リリースタグ（空の場合は SHA のみ）
    default: ""
  dockerfile:
    description: 使用する Dockerfile
    default: deploy/rust/Dockerfile
  build-args:
    description: Docker ビルド引数
    default: ""
  platforms:
    description: 配布アーキテクチャ
    default: linux/arm64
outputs:
  sha-tag:
    description: ビルドした Git revision の完全な SHA タグ
    value: ${{ steps.release.outputs.sha_tag }}
runs:
  using: composite
  steps:
    - name: Resolve image tags from checkout
      id: release
      shell: bash
      env:
        RELEASE_REF: ${{ inputs.release-ref }}
      run: |
        revision="$(git rev-parse HEAD)"
        echo "revision=$revision" >> "$GITHUB_OUTPUT"
        echo "sha_tag=sha-$revision" >> "$GITHUB_OUTPUT"
        echo "image_tag=${RELEASE_REF#*/}" >> "$GITHUB_OUTPUT"
    - uses: docker/login-action@v4.6.0
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ inputs.token }}
    - uses: docker/setup-buildx-action@v4.3.0
    - uses: docker/metadata-action@v6.2.0
      id: meta
      with:
        images: ${{ inputs.image }}
        tags: |
          type=raw,value=${{ steps.release.outputs.sha_tag }}
          type=raw,value=${{ steps.release.outputs.image_tag }},enable=${{ steps.release.outputs.image_tag != '' }}
        labels: |
          org.opencontainers.image.revision=${{ steps.release.outputs.revision }}
    - uses: docker/build-push-action@v7.3.0
      with:
        context: .
        file: ${{ inputs.dockerfile }}
        build-args: ${{ inputs.build-args }}
        platforms: ${{ inputs.platforms }}
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        cache-from: type=registry,ref=${{ inputs.image }}:buildcache
        cache-to: type=registry,ref=${{ inputs.image }}:buildcache,mode=max
