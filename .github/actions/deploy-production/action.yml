name: Deploy to production
description: 公開済みリリースをSSH経由で本番環境へデプロイします。

inputs:
  target:
    description: デプロイする対象
    required: true
  release-ref:
    description: デプロイするリリースタグ
    required: true

runs:
  using: composite
  steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        ref: ${{ inputs.release-ref }}
        path: .deploy-release

    - name: Resolve chart version
      id: chart
      shell: bash
      working-directory: .deploy-release
      run: |
        chart_version="$(ruby -e 'require "yaml"; puts YAML.safe_load_file("deploy/helm/platform/Chart.yaml").fetch("version")')"
        echo "chart_version=$chart_version" >> "$GITHUB_OUTPUT"

    - name: Configure SSH
      shell: bash
      run: |
        for variable in \
          DEPLOY_SSH_HOST \
          DEPLOY_SSH_USER \
          DEPLOY_SSH_PRIVATE_KEY \
          DEPLOY_SSH_KNOWN_HOSTS
        do
          if [[ -z "${!variable:-}" ]]; then
            echo "$variable が設定されていません。" >&2
            exit 1
          fi
        done
        install -d -m 700 ~/.ssh
        printf '%s\n' "$DEPLOY_SSH_PRIVATE_KEY" | tr -d '\r' > ~/.ssh/deploy_key
        printf '%s\n' "$DEPLOY_SSH_KNOWN_HOSTS" | tr -d '\r' > ~/.ssh/known_hosts
        chmod 600 ~/.ssh/deploy_key ~/.ssh/known_hosts

    - name: Deploy over SSH
      shell: bash
      env:
        TARGET: ${{ inputs.target }}
        RELEASE_REF: ${{ inputs.release-ref }}
        CHART_VERSION: ${{ steps.chart.outputs.chart_version }}
      working-directory: .deploy-release
      run: |
        ssh_port="${DEPLOY_SSH_PORT:-22}"
        if [[ ! "$ssh_port" =~ ^[0-9]+$ ]]; then
          echo "SSHポートが不正です: $ssh_port" >&2
          exit 1
        fi
        ssh \
          -p "$ssh_port" \
          -i ~/.ssh/deploy_key \
          -o BatchMode=yes \
          -o ConnectTimeout=15 \
          -o IdentitiesOnly=yes \
          -o StrictHostKeyChecking=yes \
          -o UserKnownHostsFile=~/.ssh/known_hosts \
          "$DEPLOY_SSH_USER@$DEPLOY_SSH_HOST" \
          bash -s -- "$TARGET" "$RELEASE_REF" "$CHART_VERSION" \
          < scripts/deploy-production.sh
