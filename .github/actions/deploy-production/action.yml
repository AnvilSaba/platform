name: Propose production release
description: 公開済み release の更新 PR を infrastructure に依頼する。
inputs:
  target:
    description: 公開した component
    required: true
  release-ref:
    description: 公開済み release tag
    required: true
  app-id:
    description: 通知専用 GitHub App ID
    required: true
  private-key:
    description: 通知専用 GitHub App private key
    required: true
runs:
  using: composite
  steps:
    - uses: actions/checkout@v7.0.1
      with:
        ref: main
        fetch-depth: 0
    - uses: $/.github/actions/setup-mise
      with:
        install-args: gh
    - name: Resolve published artifact
      id: artifact
      shell: bash
      env:
        COMPONENT: ${{ inputs.target }}
        RELEASE_REF: ${{ inputs.release-ref }}
      run: |
        case "$COMPONENT" in bot|mc-link-server|public-api|chart) ;; *) exit 1 ;; esac
        [[ "$RELEASE_REF" =~ ^$COMPONENT/v[0-9]+\.[0-9]+\.[0-9]+$ ]]
        revision=$(git rev-parse --verify "refs/tags/$RELEASE_REF^{commit}")
        repository="anvilsaba/$COMPONENT"
        tag="${RELEASE_REF#*/}"
        if [ "$COMPONENT" = chart ]; then repository=anvilsaba/charts/platform; tag="${RELEASE_REF#chart/v}"; fi
        token=$(curl --fail --silent --show-error --get \
          --data-urlencode service=ghcr.io --data-urlencode "scope=repository:$repository:pull" https://ghcr.io/token | jq -er .token)
        curl --fail --silent --show-error -H "Authorization: Bearer $token" \
          -H 'Accept: application/vnd.oci.image.index.v1+json,application/vnd.oci.image.manifest.v1+json,application/vnd.docker.distribution.manifest.list.v2+json,application/vnd.docker.distribution.manifest.v2+json' \
          "https://ghcr.io/v2/$repository/manifests/$tag" > "$RUNNER_TEMP/release-manifest.json"
        digest="sha256:$(sha256sum "$RUNNER_TEMP/release-manifest.json" | cut -d' ' -f1)"
        echo "repository=ghcr.io/$repository" >> "$GITHUB_OUTPUT"
        echo "tag=$tag" >> "$GITHUB_OUTPUT"
        echo "digest=$digest" >> "$GITHUB_OUTPUT"
        echo "revision=$revision" >> "$GITHUB_OUTPUT"
    - uses: $/.github/actions/notify-infrastructure
      with:
        app-id: ${{ inputs.app-id }}
        private-key: ${{ inputs.private-key }}
        event-type: platform-release
        component: ${{ inputs.target }}
        repository: ${{ steps.artifact.outputs.repository }}
        tag: ${{ steps.artifact.outputs.tag }}
        digest: ${{ steps.artifact.outputs.digest }}
        revision: ${{ steps.artifact.outputs.revision }}
        release: ${{ inputs.release-ref }}
