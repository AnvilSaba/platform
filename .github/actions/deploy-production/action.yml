name: Deploy to production
description: 公開済みリリースをSSH経由で本番環境へデプロイします。

inputs:
  target:
    description: デプロイする対象
    required: true
  release-ref:
    description: デプロイするリリースタグ
    required: true
  migrator-image-tag:
    description: 同じリリースコミットからビルドした Migrator タグ（省略時はリリースタグから解決）
    default: ""

runs:
  using: composite
  steps:
    - uses: actions/checkout@v7.0.1
      with:
        ref: ${{ inputs.release-ref }}
        path: .deploy-release

    - name: Resolve release artifacts
      id: chart
      shell: bash
      working-directory: .deploy-release
      env:
        TARGET: ${{ inputs.target }}
        MIGRATOR_IMAGE_TAG: ${{ inputs.migrator-image-tag }}
      run: |
        chart_version="$(ruby -e 'require "yaml"; puts YAML.safe_load_file("deploy/helm/platform/Chart.yaml").fetch("version")')"
        echo "chart_version=$chart_version" >> "$GITHUB_OUTPUT"
        revision="$(git rev-parse HEAD)"
        echo "revision=$revision" >> "$GITHUB_OUTPUT"
        if [[ "$TARGET" != chart ]]; then
          migrator_image_tag="${MIGRATOR_IMAGE_TAG:-sha-$revision}"
          if [[ "$migrator_image_tag" != "sha-$revision" ]]; then
            echo "Migrator とアプリの Git revision が一致しません。" >&2
            exit 1
          fi
          echo "migrator_image_tag=$migrator_image_tag" >> "$GITHUB_OUTPUT"
        fi

    - name: Configure SSH
      shell: bash
      run: |
        for variable in \
          DEPLOY_SSH_HOST \
          DEPLOY_SSH_USER \
          DEPLOY_SSH_PRIVATE_KEY \
          DEPLOY_SSH_KNOWN_HOSTS
        do
          if [[ -z "${!variable:-}" ]]; then
            echo "$variable が設定されていません。" >&2
            exit 1
          fi
        done
        install -d -m 700 ~/.ssh
        printf '%s\n' "$DEPLOY_SSH_PRIVATE_KEY" | tr -d '\r' > ~/.ssh/deploy_key
        printf '%s\n' "$DEPLOY_SSH_KNOWN_HOSTS" | tr -d '\r' > ~/.ssh/known_hosts
        chmod 600 ~/.ssh/deploy_key ~/.ssh/known_hosts

    - name: Deploy over SSH
      shell: bash
      env:
        TARGET: ${{ inputs.target }}
        RELEASE_REF: ${{ inputs.release-ref }}
        CHART_VERSION: ${{ steps.chart.outputs.chart_version }}
        RELEASE_REVISION: ${{ steps.chart.outputs.revision }}
        MIGRATOR_IMAGE_TAG: ${{ steps.chart.outputs.migrator_image_tag }}
      run: |
        ssh_port="${DEPLOY_SSH_PORT:-22}"
        if [[ ! "$ssh_port" =~ ^[0-9]+$ ]]; then
          echo "SSHポートが不正です: $ssh_port" >&2
          exit 1
        fi
        ssh \
          -p "$ssh_port" \
          -i ~/.ssh/deploy_key \
          -o BatchMode=yes \
          -o ConnectTimeout=15 \
          -o IdentitiesOnly=yes \
          -o StrictHostKeyChecking=yes \
          -o UserKnownHostsFile=~/.ssh/known_hosts \
          "$DEPLOY_SSH_USER@$DEPLOY_SSH_HOST" \
          bash -s -- "$TARGET" "$RELEASE_REF" "$CHART_VERSION" "$RELEASE_REVISION" "$MIGRATOR_IMAGE_TAG" \
          < scripts/deploy-production.sh
