name: Promote production release
description: 公開済みリリースの本番設定を Git に記録し、Flux に反映を任せます。

inputs:
  target:
    description: デプロイする対象
    required: true
  release-ref:
    description: デプロイするリリースタグ
    required: true
  migrator-image-tag:
    description: 同じリリースコミットからビルドした Migrator タグ（省略時はリリースタグから解決）
    default: ""

runs:
  using: composite
  steps:
    - uses: actions/checkout@v7.0.1
      with:
        ref: main
        fetch-depth: 0
    - uses: $/.github/actions/setup-mise
      with:
        install-args: rust node npm:oxfmt
    - name: Update desired release
      shell: bash
      env:
        TARGET: ${{ inputs.target }}
        RELEASE_REF: ${{ inputs.release-ref }}
        MIGRATOR_IMAGE_TAG: ${{ inputs.migrator-image-tag }}
      run: |
        mise exec -- cargo -Zscript scripts/promote-production.rs "$TARGET" "$RELEASE_REF" "$MIGRATOR_IMAGE_TAG"
        mise exec -- oxfmt deploy/flux/apps/values.yaml deploy/flux/apps/chart.yaml
    - name: Commit desired release
      shell: bash
      env:
        RELEASE_REF: ${{ inputs.release-ref }}
      run: |
        git add -- deploy/flux/apps/values.yaml deploy/flux/apps/chart.yaml
        if git diff --cached --quiet; then
          echo "本番設定は既に指定リリースです。"
          exit 0
        fi
        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git commit -m "chore(deploy): $RELEASE_REF を本番設定に反映する"
        git push origin HEAD:main
