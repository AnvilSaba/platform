# This workflow is managed by gh actions-lock.
name: Platform chart
on:
  push:
    branches: [main]
    paths:
      - deploy/helm/platform/**
      - .github/workflows/chart-platform.yml
      - .github/actions/notify-infrastructure/**
  workflow_call:
    inputs:
      release_ref:
        description: 公開する Chart のリリースタグ
        required: true
        type: string
permissions:
  contents: read
  packages: write
concurrency:
  group: chart-${{ inputs.release_ref || 'main' }}
  cancel-in-progress: ${{ !inputs.release_ref }}
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ inputs.release_ref || github.sha }}
      - uses: $/.github/actions/setup-mise
        with:
          install-args: helm gh
      - name: Resolve chart identity
        id: chart
        env:
          RELEASE_REF: ${{ inputs.release_ref }}
        run: |
          revision="$(git rev-parse HEAD)"
          version="${RELEASE_REF#chart/v}"
          if [ -z "$version" ]; then version="0.0.0-sha.$revision"; fi
          echo "revision=$revision" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          printf '\nannotations:\n  org.opencontainers.image.revision: "%s"\n' "$revision" >> deploy/helm/platform/Chart.yaml
      - name: Lint chart
        run: >-
          mise exec -- helm lint ./deploy/helm/platform
          -f ./deploy/helm/platform/values.prod.yaml
          --set-string bot.image.tag=ci
          --set-string mcLinkServer.image.tag=ci
          --set-string publicApi.image.tag=ci
      - name: Package chart
        env:
          CHART_VERSION: ${{ steps.chart.outputs.version }}
        run: mise exec -- helm package ./deploy/helm/platform --version "$CHART_VERSION" --destination "$RUNNER_TEMP"
      - name: Login to GHCR
        env:
          REGISTRY_USERNAME: ${{ github.actor }}
          REGISTRY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$REGISTRY_PASSWORD" | mise exec -- helm registry login ghcr.io --username "$REGISTRY_USERNAME" --password-stdin
      - name: Push chart
        id: push
        env:
          CHART_VERSION: ${{ steps.chart.outputs.version }}
        run: |
          mise exec -- helm push "$RUNNER_TEMP/platform-$CHART_VERSION.tgz" oci://ghcr.io/anvilsaba/charts 2>&1 | tee "$RUNNER_TEMP/chart-push.txt"
          digest=$(sed -n 's/^Digest: //p' "$RUNNER_TEMP/chart-push.txt")
          test -n "$digest"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
      - uses: $/.github/actions/notify-infrastructure
        if: ${{ !inputs.release_ref && github.ref == 'refs/heads/main' }}
        with:
          app-id: ${{ vars.GITOPS_NOTIFY_APP_ID }}
          private-key: ${{ secrets.GITOPS_NOTIFY_APP_PRIVATE_KEY }}
          component: chart
          repository: ghcr.io/anvilsaba/charts/platform
          digest: ${{ steps.push.outputs.digest }}
          revision: ${{ steps.chart.outputs.revision }}
          tag: ${{ steps.chart.outputs.version }}
