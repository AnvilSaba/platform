# This workflow is managed by gh actions-lock.

name: public-api image
on:
  push:
    branches: [main]
    paths:
      [
        "LICENSE",
        "deploy/rust/**",
        ".github/actions/build-image/**",
        ".github/actions/notify-infrastructure/**",
        "apps/public-api/**",
        "crates/**",
        "migrations/**",
        ".sqlx/**",
        ".cargo/**",
        "Cargo.toml",
        "Cargo.lock",
        "rust-toolchain.toml",
        ".github/workflows/image-public-api.yml",
      ]
  workflow_call:
    inputs:
      release_ref:
        description: ビルドするリリースタグ
        required: true
        type: string
permissions:
  contents: read
  packages: write
concurrency:
  group: image-public-api-${{ inputs.release_ref || 'main' }}
  cancel-in-progress: ${{ !inputs.release_ref }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ inputs.release_ref || github.sha }}
      - uses: $/.github/actions/setup-mise
        with:
          install-args: gh
      - uses: $/.github/actions/build-image
        id: image
        with:
          image: ghcr.io/anvilsaba/public-api
          token: ${{ secrets.GITHUB_TOKEN }}
          release-ref: ${{ inputs.release_ref }}
          build-args: |
            PACKAGE=public-api
            BINARY=public-api
            SOURCE_DIR=apps/public-api
      - uses: $/.github/actions/notify-infrastructure
        if: ${{ !inputs.release_ref && github.ref == 'refs/heads/main' }}
        with:
          app-id: ${{ vars.GITOPS_NOTIFY_APP_ID }}
          private-key: ${{ secrets.GITOPS_NOTIFY_APP_PRIVATE_KEY }}
          component: public-api
          repository: ghcr.io/anvilsaba/public-api
          digest: ${{ steps.image.outputs.digest }}
          revision: ${{ steps.image.outputs.revision }}
          tag: ${{ steps.image.outputs.sha-tag }}
