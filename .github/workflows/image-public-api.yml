name: public-api image
on:
  push:
    branches: [main]
    paths: ["LICENSE", "deploy/rust/about.toml", "deploy/rust/about.hbs", ".github/actions/build-image/**", "apps/public-api/**", "crates/**", "migrations/**", ".sqlx/**", ".cargo/**", "Cargo.toml", "Cargo.lock", "rust-toolchain.toml", "deploy/Dockerfile.rust", ".github/workflows/image-public-api.yml"]
  workflow_call:
    inputs:
      release_ref:
        description: ビルドするリリースタグ
        required: true
        type: string
permissions:
  contents: read
  packages: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.release_ref || github.ref }}
      - uses: ./.github/actions/build-image
        with:
          image: ghcr.io/anvilsaba/public-api
          token: ${{ secrets.GITHUB_TOKEN }}
          release-ref: ${{ inputs.release_ref }}
          build-args: |
            PACKAGE=public-api
            BINARY=public-api
            SOURCE_DIR=apps/public-api
