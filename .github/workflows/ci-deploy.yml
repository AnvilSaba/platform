# This workflow is managed by gh actions-lock.

name: Deploy CI

on:
  push:
    branches: [main]
    paths:
      - "deploy/**"
      - "scripts/builder-image.rs"
      - "dev/helm/**"
      - "mise.toml"
      - "rust-toolchain.toml"
      - ".github/actions/setup-mise/**"
      - ".github/actions/build-image/**"
      - ".github/workflows/ci-deploy.yml"
      - ".github/workflows/chart-platform.yml"
      - ".github/workflows/release.yml"
  pull_request:
    paths:
      - "deploy/**"
      - "scripts/builder-image.rs"
      - "dev/helm/**"
      - "mise.toml"
      - "rust-toolchain.toml"
      - ".github/actions/setup-mise/**"
      - ".github/actions/build-image/**"
      - ".github/workflows/ci-deploy.yml"
      - ".github/workflows/chart-platform.yml"
      - ".github/workflows/release.yml"

permissions:
  contents: read

jobs:
  helm:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        values:
          - dev/helm/values.dev.yaml
          - deploy/helm/platform/values.yaml
          - dev/helm/values.integration.yaml
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: $/.github/actions/setup-mise
        with:
          install-args: helm
      - name: Lint chart
        run: >-
          mise exec -- helm lint ./deploy/helm/platform
          -f ./${{ matrix.values }}
          --set-string bot.image.tag=ci
          --set-string mcLinkServer.image.tag=ci
          --set-string publicApi.image.tag=ci
      - name: Render manifests
        run: >-
          mise exec -- helm template platform ./deploy/helm/platform
          --namespace anvilsaba
          -f ./${{ matrix.values }}
          --set-string bot.image.digest=sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
          --set-string mcLinkServer.image.tag=ci
          --set-string publicApi.image.tag=ci
          > /dev/null
  image-action:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Parse image action
        run: ruby -e "require 'yaml'; YAML.safe_load_file('.github/actions/build-image/action.yml')"
      - uses: $/.github/actions/setup-mise
        with:
          install-args: rust
      - name: Check Rust builder image selection
        run: |
          mise exec -- rustup component add clippy
          mise exec -- cargo clippy -Zscript --manifest-path scripts/builder-image.rs --all-targets -- -D warnings
          mise exec -- cargo test -Zscript --manifest-path scripts/builder-image.rs
          mise :builder-image
