# This workflow is managed by gh actions-lock.

name: Bot image
on:
  push:
    branches: [main]
    paths:
      [
        "LICENSE",
        "deploy/rust/**",
        ".github/actions/build-image/**",
        "apps/bot/**",
        "crates/**",
        "migrations/**",
        ".sqlx/**",
        ".cargo/**",
        "Cargo.toml",
        "Cargo.lock",
        "rust-toolchain.toml",
        ".github/workflows/image-bot.yml",
      ]
  workflow_call:
    inputs:
      release_ref:
        description: ビルドするリリースタグ
        required: true
        type: string
permissions:
  contents: read
  packages: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ inputs.release_ref || github.ref }}
      - uses: $/.github/actions/build-image
        with:
          image: ghcr.io/anvilsaba/bot
          token: ${{ secrets.GITHUB_TOKEN }}
          release-ref: ${{ inputs.release_ref }}
          build-args: |
            PACKAGE=bot
            BINARY=bot
            SOURCE_DIR=apps/bot
