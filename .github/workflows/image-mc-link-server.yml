name: mc-link-server image
on:
  push:
    branches: [main]
    paths:
      [
        "LICENSE",
        "deploy/rust/**",
        ".github/actions/build-image/**",
        "apps/mc-link-server/**",
        "crates/**",
        "migrations/**",
        ".sqlx/**",
        ".cargo/**",
        "Cargo.toml",
        "Cargo.lock",
        "rust-toolchain.toml",
        ".github/workflows/image-mc-link-server.yml",
      ]
  workflow_call:
    inputs:
      release_ref:
        description: ビルドするリリースタグ
        required: true
        type: string
permissions:
  contents: read
  packages: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.release_ref || github.ref }}
      - uses: ./.github/actions/build-image
        with:
          image: ghcr.io/anvilsaba/mc-link-server
          token: ${{ secrets.GITHUB_TOKEN }}
          release-ref: ${{ inputs.release_ref }}
          build-args: |
            PACKAGE=mc-link-server
            BINARY=mc-link-server
            SOURCE_DIR=apps/mc-link-server
