name: db-migrator image
on:
  push:
    branches: [main]
    paths:
      [
        "LICENSE",
        "deploy/rust/**",
        ".github/actions/build-image/**",
        "apps/db-migrator/**",
        "crates/**",
        "migrations/**",
        ".sqlx/**",
        ".cargo/**",
        "Cargo.toml",
        "Cargo.lock",
        "rust-toolchain.toml",
        ".github/workflows/image-db-migrator.yml",
      ]
  workflow_call:
    inputs:
      release_ref:
        description: 呼び出し元アプリのリリースタグ
        required: true
        type: string
    outputs:
      image_tag:
        description: Migrator の完全な SHA タグ
        value: ${{ jobs.build.outputs.image_tag }}
permissions:
  contents: read
  packages: write
jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.image.outputs.sha-tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.release_ref || github.ref }}
      - uses: ./.github/actions/build-image
        id: image
        with:
          image: ghcr.io/anvilsaba/db-migrator
          token: ${{ secrets.GITHUB_TOKEN }}
          build-args: |
            PACKAGE=db-migrator
            BINARY=db-migrator
            SOURCE_DIR=apps/db-migrator
