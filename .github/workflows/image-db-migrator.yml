# This workflow is managed by gh actions-lock.

name: db-migrator image
on:
  push:
    branches: [main]
    paths:
      [
        "LICENSE",
        "deploy/rust/**",
        ".github/actions/build-image/**",
        ".github/actions/notify-infrastructure/**",
        "apps/db-migrator/**",
        "crates/**",
        "migrations/**",
        ".sqlx/**",
        ".cargo/**",
        "Cargo.toml",
        "Cargo.lock",
        "rust-toolchain.toml",
        ".github/workflows/image-db-migrator.yml",
      ]
  workflow_call:
    inputs:
      release_ref:
        description: 呼び出し元アプリのリリースタグ
        required: true
        type: string
    outputs:
      image_tag:
        description: Migrator の完全な SHA タグ
        value: ${{ jobs.build.outputs.image_tag }}
permissions:
  contents: read
  packages: write
concurrency:
  group: image-db-migrator-${{ inputs.release_ref || 'main' }}
  cancel-in-progress: ${{ !inputs.release_ref }}

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.image.outputs.sha-tag }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ inputs.release_ref || github.sha }}
      - uses: $/.github/actions/setup-mise
        with:
          install-args: gh
      - uses: $/.github/actions/build-image
        id: image
        with:
          image: ghcr.io/anvilsaba/db-migrator
          token: ${{ secrets.GITHUB_TOKEN }}
          build-args: |
            PACKAGE=db-migrator
            BINARY=db-migrator
            SOURCE_DIR=apps/db-migrator
      - uses: $/.github/actions/notify-infrastructure
        if: ${{ !inputs.release_ref && github.ref == 'refs/heads/main' }}
        with:
          app-id: ${{ vars.GITOPS_NOTIFY_APP_ID }}
          private-key: ${{ secrets.GITOPS_NOTIFY_APP_PRIVATE_KEY }}
          component: db-migrator
          repository: ghcr.io/anvilsaba/db-migrator
          digest: ${{ steps.image.outputs.digest }}
          revision: ${{ steps.image.outputs.revision }}
          tag: ${{ steps.image.outputs.sha-tag }}
