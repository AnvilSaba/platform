name: Release

run-name: Release ${{ inputs.app }}${{ inputs.dry_run && ' [DryRun]' || '' }}

on:
  workflow_dispatch:
    inputs:
      app:
        description: リリースする対象
        required: true
        type: choice
        options:
          - bot
          - mcguildlink
          - chart
      bump:
        description: バージョン更新（auto は Conventional Commits から判定）
        required: true
        default: auto
        type: choice
        options:
          - auto
          - major
          - minor
          - patch
      dry_run:
        description: タグ・変更ログを確認
        required: true
        default: true
        type: boolean
      deploy:
        description: リリース後に本番へデプロイ
        required: true
        default: false
        type: boolean

permissions:
  contents: write
  packages: write

concurrency:
  group: release-${{ inputs.app }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.release.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: main
      - uses: taiki-e/install-action@41ef8c65f4034ff24ab1cc2cef52f3000bcf9523 # v2.62.40
        with:
          tool: git-cliff@2.13.1
      - name: Prepare release
        id: release
        shell: pwsh
        run: |
          $dryRun = [System.Convert]::ToBoolean('${{ inputs.dry_run }}')
          $tag = ./scripts/prepare-release.ps1 -App '${{ inputs.app }}' -Bump '${{ inputs.bump }}' -DryRun:$dryRun | Select-Object -Last 1
          "tag=$tag" >> $env:GITHUB_OUTPUT
      - name: Commit and tag
        if: ${{ !inputs.dry_run }}
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore(release): ${RELEASE_TAG}"
          git tag -a "${RELEASE_TAG}" -m "${RELEASE_TAG}"
          git push origin HEAD:main "${RELEASE_TAG}"

  build-bot-image:
    if: inputs.app == 'bot' && !inputs.dry_run
    needs: release
    uses: ./.github/workflows/image-bot.yml
    with:
      release_ref: ${{ needs.release.outputs.tag }}

  build-mcguildlink-image:
    if: inputs.app == 'mcguildlink' && !inputs.dry_run
    needs: release
    uses: ./.github/workflows/image-mcguildlink.yml
    with:
      release_ref: ${{ needs.release.outputs.tag }}

  publish-platform-chart:
    if: inputs.app == 'chart' && !inputs.dry_run
    needs: release
    uses: ./.github/workflows/chart-platform.yml
    with:
      release_ref: ${{ needs.release.outputs.tag }}

  deploy:
    if: >-
      !cancelled() &&
      !inputs.dry_run &&
      inputs.deploy &&
      needs.release.result == 'success' &&
      (
        (inputs.app == 'bot' && needs.build-bot-image.result == 'success') ||
        (inputs.app == 'mcguildlink' && needs.build-mcguildlink-image.result == 'success') ||
        (inputs.app == 'chart' && needs.publish-platform-chart.result == 'success')
      )
    needs:
      - release
      - build-bot-image
      - build-mcguildlink-image
      - publish-platform-chart
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/deploy-production
        with:
          target: ${{ inputs.app }}
          release-ref: ${{ needs.release.outputs.tag }}
        env:
          DEPLOY_SSH_HOST: ${{ secrets.DEPLOY_SSH_HOST }}
          DEPLOY_SSH_USER: ${{ secrets.DEPLOY_SSH_USER }}
          DEPLOY_SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
          DEPLOY_SSH_KNOWN_HOSTS: ${{ secrets.DEPLOY_SSH_KNOWN_HOSTS }}
          DEPLOY_SSH_PORT: ${{ vars.DEPLOY_SSH_PORT }}
