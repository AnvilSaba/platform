name: MCGuildLink image
env:
  # amd64 も配布する場合は linux/arm64,linux/amd64 に変更する
  TARGET_PLATFORMS: linux/arm64
on:
  push:
    branches: [main]
    paths: ["LICENSE", "apps/mcguildlink/**"]
  workflow_call:
    inputs:
      release_ref:
        description: ビルドするリリースタグ
        required: true
        type: string
permissions:
  contents: read
  packages: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.release_ref || github.ref }}
      - name: Resolve release image tag
        id: release
        if: inputs.release_ref != ''
        env:
          RELEASE_REF: ${{ inputs.release_ref }}
        run: echo "image_tag=${RELEASE_REF#mcguildlink/}" >> "$GITHUB_OUTPUT"
      - name: Make Gradle Wrapper executable
        run: chmod +x apps/mcguildlink/gradlew
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        id: meta
        with:
          images: ghcr.io/anvilsaba/mcguildlink
          tags: |
            type=sha
            type=raw,value=${{ steps.release.outputs.image_tag }},enable=${{ steps.release.outputs.image_tag != '' }}
      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: apps/mcguildlink/Dockerfile
          platforms: ${{ env.TARGET_PLATFORMS }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=registry,ref=ghcr.io/anvilsaba/mcguildlink:buildcache
          cache-to: type=registry,ref=ghcr.io/anvilsaba/mcguildlink:buildcache,mode=max
