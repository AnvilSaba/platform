name: MCGuildLink CI
on:
  push:
    paths: ["apps/mcguildlink/**"]
  pull_request:
    paths: ["apps/mcguildlink/**"]
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mcguildlink
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: jetbrains
          java-version: "25"
      - run: chmod +x gradlew
      - run: ./gradlew --no-daemon test
