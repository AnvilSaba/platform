# This workflow is managed by gh actions-lock.

name: Production update PR

run-name: Promote ${{ inputs.release_ref }} for production PR

on:
  workflow_dispatch:
    inputs:
      target:
        description: PR に含める対象
        required: true
        type: choice
        options:
          - bot
          - mc-link-server
          - public-api
          - chart
      release_ref:
        description: デプロイする既存リリースタグ
        required: true
        type: string

permissions:
  contents: read
  packages: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production/${{ inputs.target }}
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: $/.github/actions/deploy-production
        with:
          target: ${{ inputs.target }}
          release-ref: ${{ inputs.release_ref }}
          app-id: ${{ vars.GITOPS_NOTIFY_APP_ID }}
          private-key: ${{ secrets.GITOPS_NOTIFY_APP_PRIVATE_KEY }}
          registry-token: ${{ secrets.GITHUB_TOKEN }}
