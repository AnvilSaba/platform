name: Production deployment

run-name: Deploy ${{ inputs.release_ref }} to production

on:
  workflow_dispatch:
    inputs:
      target:
        description: デプロイする対象
        required: true
        type: choice
        options:
          - bot
          - mcguildlink
          - chart
      release_ref:
        description: デプロイする既存リリースタグ
        required: true
        type: string

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/deploy-production
        with:
          target: ${{ inputs.target }}
          release-ref: ${{ inputs.release_ref }}
        env:
          DEPLOY_SSH_HOST: ${{ secrets.DEPLOY_SSH_HOST }}
          DEPLOY_SSH_USER: ${{ secrets.DEPLOY_SSH_USER }}
          DEPLOY_SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
          DEPLOY_SSH_KNOWN_HOSTS: ${{ secrets.DEPLOY_SSH_KNOWN_HOSTS }}
          DEPLOY_SSH_PORT: ${{ vars.DEPLOY_SSH_PORT }}
