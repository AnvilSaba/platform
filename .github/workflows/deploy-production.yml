# This workflow is managed by gh actions-lock.

name: Production deployment

run-name: Promote ${{ inputs.release_ref }} to production GitOps

on:
  workflow_dispatch:
    inputs:
      target:
        description: デプロイする対象
        required: true
        type: choice
        options:
          - bot
          - mc-link-server
          - public-api
          - chart
      release_ref:
        description: デプロイする既存リリースタグ
        required: true
        type: string

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production/${{ inputs.target }}
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: $/.github/actions/deploy-production
        with:
          target: ${{ inputs.target }}
          release-ref: ${{ inputs.release_ref }}
