monorepo_root = true

[monorepo]
config_roots = ["apps/*", "crates/*", "deploy/helm/platform"]

[settings]
experimental = true
idiomatic_version_file_enable_tools = ["node", "rust"]
minimum_release_age = "7d"

[tools]
"npm:oxfmt" = "0.71.0"

[tools."cargo:sqlx-cli"]
version = "0.9.0"
default-features = false
features = ["postgres", "rustls"]

[deps.npm]
auto = true
run = "npm ci"

[hooks]
postinstall = "mise deps"

[task_config]
cascade = true
shell = "{% if os() == 'windows' %}cmd /d /c{% else %}sh -c{% endif %}"

[vars]
engine = "wslc"
null = "{% if os() == 'windows' %}NUL{% else %}/dev/null{% endif %}"

# Formatting

[tasks.fmt]
description = "Rust とその他の対応ファイルを整形する"
run = ["cargo fmt --all", "mise exec -- oxfmt"]

[tasks."fmt:check"]
description = "Rust とその他の対応ファイルの整形を検査する"
run = ["cargo fmt --all -- --check", "mise exec -- oxfmt --check"]

# Build

[tasks.build]
description = "Rust ワークスペースをビルドする（-p で個別指定）"
run = "cargo build --locked"

# Checks

[tasks.check]
description = "Rust ワークスペースの全ターゲットを検査する"
run = "cargo check --locked --all-targets"

# Tests

[tasks.test]
description = "テスト用 DB を起動し、Rust ワークスペースをテストする"
depends = ["db:test:up"]
env.DATABASE_URL = "postgres://postgres:test-password@127.0.0.1:55433/platform_test"
run = "cargo test --locked"

# Applications

[tasks.up]
description = "開発用 DB を準備し、全アプリを並列起動する"
depends = ["//apps/...:run"]

[tasks.down]
description = "開発用 DB を停止する（データは保持）"
depends = ["db:down"]

# Development database

[tasks."db:up"]
description = "開発用 PostgreSQL を起動し、接続可能になるまで待つ"
run = [
  '{{ vars.engine }} start platform-local-postgres >{{ vars.null }} 2>&1 || {{ vars.engine }} run --detach --name platform-local-postgres --publish 127.0.0.1:55432:5432 --env POSTGRES_USER=postgres --env POSTGRES_PASSWORD=dev-password --env POSTGRES_DB=platform --volume platform-local_postgres-data:/var/lib/postgresql --volume "{{ config_root }}/deploy/postgres/bootstrap.sql:/docker-entrypoint-initdb.d/10-bootstrap.sql:ro" --volume "{{ config_root }}/deploy/postgres/local-passwords.sql:/docker-entrypoint-initdb.d/20-passwords.sql:ro" docker.io/library/postgres:18.6-trixie',
  '{{ vars.engine }} exec -i platform-local-postgres sh -s -- platform < "{{ config_root }}/scripts/wait-postgres.sh"',
]

[tasks."db:down"]
description = "開発用 PostgreSQL を停止する（データは保持）"
run = "{{ vars.engine }} stop platform-local-postgres"

[tasks."db:logs"]
description = "開発用 PostgreSQL のログを表示する"
run = "{{ vars.engine }} logs --tail 100 platform-local-postgres"

[tasks."db:migrate"]
description = "開発用 DB にマイグレーションを適用する"
depends = ["db:up"]
env.DATABASE_URL = "postgres://platform_db_migrator:migrator-dev-password@127.0.0.1:55432/platform"
run = "sqlx migrate run"

[tasks."db:reset"]
description = "開発用 DB の全データを削除し、再作成してマイグレーションを適用する"
run = [
  "{{ vars.engine }} rm --force platform-local-postgres",
  "{{ vars.engine }} volume rm platform-local_postgres-data",
  { task = "db:migrate" },
]

# Test database

[tasks."db:test:up"]
description = "テスト用 PostgreSQL を起動し、接続可能になるまで待つ"
run = [
  '{{ vars.engine }} start platform-local-postgres-test >{{ vars.null }} 2>&1 || {{ vars.engine }} run --detach --name platform-local-postgres-test --publish 127.0.0.1:55433:5432 --env POSTGRES_USER=postgres --env POSTGRES_PASSWORD=test-password --env POSTGRES_DB=platform_test --volume platform-local_postgres-test-data:/var/lib/postgresql docker.io/library/postgres:18.6-trixie',
  '{{ vars.engine }} exec -i platform-local-postgres-test sh -s -- platform_test < "{{ config_root }}/scripts/wait-postgres.sh"',
]

[tasks."db:test:down"]
description = "テスト用 PostgreSQL を停止する（データは保持）"
run = "{{ vars.engine }} stop platform-local-postgres-test"

[tasks."db:test:logs"]
description = "テスト用 PostgreSQL のログを表示する"
run = "{{ vars.engine }} logs --tail 100 platform-local-postgres-test"

[tasks."db:test:reset"]
description = "テスト用 DB の全データを削除し、空の DB を再作成する"
run = [
  "{{ vars.engine }} rm --force platform-local-postgres-test",
  "{{ vars.engine }} volume rm platform-local_postgres-test-data",
  { task = "db:test:up" },
]

# SQLx metadata

[tasks."sqlx:prepare"]
description = "開発用 DB から SQL メタデータを更新する"
depends = ["db:migrate"]
env.DATABASE_URL = "postgres://postgres:dev-password@127.0.0.1:55432/platform"
run = "cargo sqlx prepare --workspace -- --all-targets --locked"

[tasks."sqlx:check"]
description = "開発用 DB と SQL メタデータの一致を検査する"
depends = ["db:migrate"]
env.DATABASE_URL = "postgres://postgres:dev-password@127.0.0.1:55432/platform"
run = "cargo sqlx prepare --check --workspace -- --all-targets --locked"
